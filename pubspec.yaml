name: oga_glow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  shimmer: ^3.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.4.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/animations/
# -------------------------------
# Native Splash Configuration
# -------------------------------
flutter_native_splash:
  color: "00000000"
  image: assets/images/logo.png

  android: true
  ios: true
  web: false

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#00000000"
    color: "#00000000"